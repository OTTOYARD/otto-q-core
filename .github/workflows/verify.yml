name: verify
# C6 CI gate: solver + policy batteries and the 24h seeded KPI regression gate.
# Pure-Python + committed artifacts; no secrets, no database, no deploy.
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    # 20 until 2026-10-09, when the job's own steps outgrew it: the agent SQL suites (0614-0628) take ~10 minutes and the
    # job reached the limit with the 0630-0631 step 36 seconds in (run 37888824528, cancelled, not failed). The limit
    # catches a hang; it is not a budget for the tests, so it sits well above the job's own length: 40 until the 0632-0638
    # suites took the job to 32 minutes (run 37904376715, 0637's head), then 60. 90 from 2026-10-19, when the job took 55
    # minutes on fff1a77 (run 39264204293) before the 0758 and 0759 suites were added.
    timeout-minutes: 90
    # G12, second rung. A scratch PostgreSQL that holds NOTHING -- no engine
    # schema, no data. It exists so plpgsql can be compiled, which is all the
    # compile-check step needs and all it claims.
    services:
      scratch_pg:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Installs THE pin, from the one file that carries it. See requirements.txt for why the
      # OR-Tools version is part of a run's identity rather than hygiene.
      - run: pip install -r requirements.txt
      - name: CP-SAT prototype battery (incl. byte-identical determinism)
        run: python3 solvers/cpsat/test_cpsat_prototype.py
      - name: Policy battery (P1-P5, incl. byte-for-byte committed comparison)
        run: python3 policies/test_policies.py
      - name: KPI regression gate (24h seeded comparison vs committed baseline)
        run: python3 metrics/kpi_gate.py
      # The conformance suite and the site-profile/tariff tests were never gated --
      # verify.yml ran three scripts and no pytest, so C11's falsification instrument
      # and everything under sites/ could break without CI noticing.
      # tests/test_migration_hygiene.py rides in here. It needs NO database, which
      # is the point: the drift check was blind for 193 migrations because 93 files
      # had no version header and 98 more carried invented ones, and nothing in CI
      # ever looked at db/migrations at all. Both are properties of committed files.
      - name: Pytest suite (conformance, site profiles, tariffs, recall, adapters, migration hygiene)
        run: python3 -m pytest -q
      # tests/*.test.mjs -- the ONLY tests covering the edge functions, i.e. the agent ->
      # CP-SAT -> kernel chain and the proposal/disposition contract. They were never run
      # here: this workflow ran three scripts and pytest, and node was never invoked at all.
      # MEASURED 2026-09-21: `node --test tests/*.test.mjs` at commit f0b13fc returned
      # 22 tests / 1 FAILING, and it had been failing since 591305d on 2026-09-19 -- two
      # days red with nobody able to see it. The assertion in question was itself stale
      # (it demanded EdgeRuntime.waitUntil from a function that deliberately awaits the
      # handoff), which is the second half of the same defect: a test nothing runs is a
      # test nothing maintains. Both are fixed in db/checks/0306.
      # Node is PINNED rather than taken from the runner image, and the floor is not
      # cosmetic: these tests `import ... from "../edge-functions/_shared/*.ts"` directly,
      # which needs the unflagged TypeScript type-stripping that landed in Node 22.18.
      # ubuntu-latest's default node has been 20.x, where every one of these files fails to
      # import with ERR_UNKNOWN_FILE_EXTENSION -- an error that looks like a broken test
      # rather than a wrong runtime. The assertion below makes the runtime the thing that
      # fails when it is wrong.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Edge-function suite (agent/solver chain, proposal disposition)
        run: |
          set -euo pipefail
          node -e 'const [maj,min]=process.versions.node.split(".").map(Number);
            if (maj<22 || (maj===22 && min<18)) {
              console.error(`node ${process.versions.node} cannot import .ts without a flag; need >=22.18`);
              process.exit(1);
            }'
          node --test tests/*.test.mjs
      # G12, second rung: compile every PENDING migration against a throwaway
      # PostgreSQL. It runs each file (execution stops at the first precondition
      # that fails, which against an empty database is early and by design) and
      # separately compiles every DO block, which is how blocks AFTER that first
      # failure get checked at all.
      #
      # WHY ONLY PENDING FILES. A migration that has been applied to production
      # has passed the strongest check there is. Gating on all 186 would risk a
      # permanently-red step for an old file whose compile error never mattered,
      # and this workflow's own comments are about why a permanently-red gate is
      # a gate nobody reads.
      #
      # WHAT IT WOULD HAVE CAUGHT, both on 2026-09-14, both in files already
      # committed as PENDING: 0322's `RAISE '% -> %% ... (still %)', a, b, c, d`
      # (three placeholders, four arguments) and 0321's
      # `format('... % ...', x)` (RAISE takes a bare %, format() demands %s).
      # Each would otherwise have failed during an apply window, after a
      # certification round had been waited out.
      - name: Compile-check PENDING migrations (scratch database, nothing applied)
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGDATABASE: postgres
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          mapfile -t PENDING < <(grep -l 'migration-version: PENDING' db/migrations/*.sql || true)
          if [ ${#PENDING[@]} -eq 0 ]; then
            echo "no PENDING migrations to compile-check"; exit 0
          fi
          printf 'compile-checking %d PENDING migration(s)\n' "${#PENDING[@]}"
          python3 scripts/compile-check.py "${PENDING[@]}"

      # The agent gateway's database half, EXECUTED rather than only compiled. The step above stops at 0559's first
      # precondition in an empty database (by design), so its tables, grants, dispatcher, scoping, routing and guards
      # would otherwise reach an apply window unexecuted. tests/test_agent_gateway_sql.py loads a stub engine whose
      # doors are the live bodies (md5-asserted) into a throwaway database on the same scratch server, applies
      # 0559/0560 and drops it again; tests/agent_gateway.test.mjs then drives the gateway's HTTP handler over the same
      # SQL end to end. Both SKIP without these variables, which the pytest and edge-function steps above do not set,
      # so this is the step where they run. Ordered AFTER the compile-check because the stub creates the cluster-wide roles
      # anon/authenticated/service_role, and the compile-check's premise is a server that holds nothing.
      # 0605/0606 ride in the same step for the same reason: an owner's agent setting what its own cars need changes
      # three tick-path bodies and adds two triggers, none of which a compile-check can see. tests/test_owner_agent_sql.py
      # drives them on a second stub engine (its copied bodies md5-pinned to the live catalog), and
      # tests/owner_agent.test.mjs drives the gateway's owner tools and POST /v1/ask over the same SQL end to end.
      # 0607/0608 too: the passcode door lets a caller with no key in, so tests/test_passcode_door_sql.py drives the
      # welcome, the passcode and its throttle, sessions and their end with the run, and the confirmation code, and
      # tests/passcode_door.test.mjs drives the same through the gateway over MCP and REST with no Authorization header.
      # The node files run ONE AT A TIME (--test-concurrency=1). Each end-to-end block loads the migrations into its own
      # database, but a migration's P0 reads pg_stat_activity, which spans every database on the server. Run side by
      # side, one file loading 0559 (whose text names ottoq_determinism_pair) made another file's 0560 P0 refuse with
      # "a pair or the recert runner is running right now" (verify on 23b8572).
      # 0700 too: an owner signs in and connects their own agent (OAuth 2.1). tests/test_agent_signin_sql.py drives the
      # registration, the device code, the browser authorization with PKCE, refresh rotation and reuse, revocation, the
      # owner's doors and the grants; tests/agent_signin.test.mjs drives the gateway's sign-in endpoints and /account/mcp,
      # and the whole device sign-in over the same SQL end to end.
      - name: Agent gateway, executed (0559/0560/0605-0608/0700 against stub engines; HTTP end to end)
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          python3 -m pytest -q tests/test_agent_gateway_sql.py tests/test_owner_agent_sql.py tests/test_passcode_door_sql.py tests/test_agent_signin_sql.py
          node --test --test-concurrency=1 tests/agent_gateway.test.mjs tests/owner_agent.test.mjs tests/passcode_door.test.mjs tests/agent_signin.test.mjs

      # 0564, EXECUTED with real concurrent sessions against a stub engine: a manual start interrupts a running
      # check (a recertification pair, a hand-run pair, a dial experiment), leaves a migration and a monitor alone,
      # and holds the world lock so no check starts before the run is live. Its claims are about concurrency, so a
      # compile-check cannot see them. SKIPS without these variables, like the gateway step above.
      - name: Operator start interrupts a running check, executed (0564 against a stub engine)
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          python3 -m pytest -q tests/test_operator_start_interrupt_sql.py

      # 0645/0646, EXECUTED against the two retention procedures' live bodies: before 0645 the recert runner latches
      # the nightly run purge shut; after it, the purge takes only finished, archived, non-production runs that ended
      # more than 7 days ago (21 with charge orders) from the six tables the learning never reads -- never
      # ottoq_events, never ottoq_sim_runs -- stamps exactly those, and stops for a certification in flight at its
      # start or between batches. 0646: the wall-clock walk spares production and running runs' rule evaluations.
      - name: Retention purges, executed (0645, 0646 against the live procedures' own source)
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          python3 -m pytest -q tests/test_run_purge_sql.py

      # 0565's throughput scorecard, executed: each definition in its section 3 (served, departure, on time, needed work
      # open at departure, a triage clear, the tier groups, the step) is pinned by a visit built to exercise it, and the
      # migration's own V-blocks (append-only, a determinism pair scoring identically) run during the apply.
      - name: Throughput scorecard, executed (0565 against a stub engine)
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          python3 -m pytest -q tests/test_throughput_scorecard_sql.py

      # 0567: a build-out converts exactly the spaces it names, the restore puts back exactly what it found, a
      # transaction that forgets to restore cannot commit, and a build-out day scores from its own record afterwards.
      - name: Charger build-out, executed (0567 against a stub engine)
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          python3 -m pytest -q tests/test_site_buildout_sql.py

      # 0568: the overnight sweep runs only in its window, between runs and after certification; seed by seed and cell
      # by cell, never repeating an arm since the dial floor; build-out applied before the door and restored after the
      # teardown; an engine error recorded with its arm, a failed arm recorded and not retried; the arms are evidence.
      - name: Throughput sweep, margin ledger, dial contrasts, fleet build-outs, night 2's value sweep, the Value tab's contract, the peak after a test day's opening and replicate identity, executed (0568, 0569, 0571, 0572, 0575, 0576, 0577, 0578 against a stub engine)
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          python3 -m pytest -q tests/test_throughput_sweep_sql.py

      - name: Charge batch order, executed (0570 against the live optimizer's own source)
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          python3 -m pytest -q tests/test_charge_batch_order_sql.py

      # 0573: the charge curves and service times calibrated to public data. The calibrated minutes, what did not change
      # (every L2 charge, a DC charge with no battery size), which cars' facts change, the sixty-minute sensor
      # calibration, the refusals and the header's rollback, against the live charge functions carried byte for byte.
      - name: Charge and service calibration, executed (0573 against the live charge functions' own source)
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          python3 -m pytest -q tests/test_charge_calibration_sql.py

      # 0574: the twin depot's price of power is NES Schedule TGSA Part 3 plus the fuel adjustment. What the reader
      # returns before and after, across the seasons, against the live reader carried byte for byte; no other depot.
      - name: Energy price, executed (0574 against the live tariff reader's own source)
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          python3 -m pytest -q tests/test_energy_price_sql.py

      # 0600/0601: the battery's day plan bills the completed half hour, refills its reserve in the valleys and never lifts
      # its own half hour over the cap; the queue forecast charges a waiting car at the rate its battery takes. Against the
      # live plan, evaluator, forecast and scheduler carried byte for byte, on the smoke arm's own samples.
      - name: Battery half hour, executed (0600, 0601 against the live day plan and queue forecast)
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          python3 -m pytest -q tests/test_bess_half_hour_sql.py

      # 0602: the calendar sheds the exclusion constraint its strongest one subsumes. Every overlap v2 refused is still
      # refused, by v3; v1's own region still by v1; the refusals and the header's rollback.
      - name: Calendar exclusion, executed (0602 against the live calendar's constraints)
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          python3 -m pytest -q tests/test_calendar_exclusion_sql.py

      # 0603: two scheduler tasks orphaned in June stop stranding a car on every OTTO-Q test day. HW.005 passes the car
      # it refused and still refuses a real second task; the change is filed under no run; refusals and rollback.
      - name: Legacy task repair, executed (0603 against the live HW.005 evaluator)
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          python3 -m pytest -q tests/test_legacy_task_sql.py

      # 0604: a read-only measure of whether a run's fast chargers went to the cars that needed them; its arithmetic on
      # sessions worked by hand, rule 8's depot predicate, the refusals and the rollback.
      - name: Charger fit profile, executed (0604)
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          python3 -m pytest -q tests/test_charger_fit_profile_sql.py

      # 0614-0627 had no executed step, so the agent's charge order, the kernel's check of it (0618, 0620), the
      # hindsight grader (0621), the learned charge clock (0619, 0622), the depot's outflow in the check (0623), its
      # dwell by each car's open work (0624), the clock's record of changes in its world, with the scan that finds
      # them (0625), the self-review that judges the clock within runs and ranks what to build (0626), and the futures
      # that call each car home the way the kernel's own recall decision does (0627), and that drain each car at its own
      # class's and model's rate (0628), skipped in the pytest step above with every other SQL suite. The eight files
      # share one miniature depot (two fast chargers, three L2, six cars) on stub engines whose copied bodies are
      # md5-pinned to the live catalog; 151 tests, about 9 minutes on a local scratch server.
      - name: Agent charge order, its check, hindsight, the charge clock, the outflow, the self-review, the recall rule and the drain by class, executed (0614-0628 against stub engines)
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          python3 -m pytest -q tests/test_agent_charge_order_sql.py tests/test_agent_arbiter_sql.py tests/test_agent_outflow_sql.py \
            tests/test_agent_dwell_class_sql.py tests/test_agent_regime_sql.py tests/test_agent_self_review_sql.py \
            tests/test_agent_recall_rule_sql.py tests/test_agent_drain_class_sql.py

      # 0629 arms a production session and refuses every write under an agent's name that would reach one (CLAUDE.md
      # rule 10). Its own fixture carries the five bodies it patches and the setter's helpers, md5-pinned to the live
      # catalog: the start arms the session for a 120-second tick, an agent's write and ops action are refused there and
      # taken on a twin run, a person's are taken, and every other run is armed as before. 12 tests, about 5 seconds.
      - name: A production session is armed and no agent write reaches it, executed (0629 against the live bodies)
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          python3 -m pytest -q tests/test_agent_production_arm_sql.py

      # 0630 reads a run's stop as the stop in the hindsight grader, computes a grade in one place for the first grade
      # and a regrade, keeps a regrade beside a wrong first grade, and points every reader at the standing grade. On the
      # miniature depot through 0628 with 0621's morning stopped at minute 50: the interrupted charge is censored and the
      # first grade superseded, a grade after 0630 reads the stop as the stop, the computation is the grade, each
      # refusal. 0631 gives a charger fault the whole of the charge it cut and supersedes an attribution with its grade:
      # the same morning with the charge under way cut by a fault at minute 30. 16 tests, about 80 seconds.
      - name: The grader reads a run's stop as the stop and a fault's cut as the fault's, executed (0630-0631 against stub engines)
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          python3 -m pytest -q tests/test_agent_regrade_sql.py tests/test_agent_fault_cut_sql.py

      # 0632 gives the charge clock a level for the air, per kind of charger, chosen by leaving each run out (none, a
      # line, or a line with a bend), on a planted fleet whose fast charges slow 3% a degree above 22 and whose L2
      # charges slow 2% a degree above 18: it finds the bend, a world with no effect gets no level, {"air": false} is
      # 0625's fit, the clock holds the edge of what it saw, the run offset is what the air leaves. 10 tests, about 60 s.
      - name: The charge clock reads the air, executed (0632 against stub engines)
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          python3 -m pytest -q tests/test_agent_air_clock_sql.py

      # 0633 has the return fit learn the spread of the check's own arrival forecasts from its graded orders (a floor, a
      # walk and a drift by relative least squares) and the inbound forecast spread each car at work by it, behind a
      # person's dial. On graded forecasts planted from a known spread for 150 returns at 8 horizons: the fit recovers
      # it and the futures' reader finds 80% inside the band, a flat world is a floor alone, too few returns or the dial
      # at 0 is 0628's forecast, a past fit reads the grades that stood then. 8 tests, about 55 seconds.
      - name: The futures spread each arrival as the returns show, executed (0633 against stub engines)
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          python3 -m pytest -q tests/test_agent_arrival_spread_sql.py

      # 0634 times a car's drain only from a dispatch the depot saw begin (a run's primed cars carry a back-dated
      # dispatch and a battery set at the start), counts work from the later of the two, and has the arrival spread read
      # the newest forecast's orders once they alone are usable. On reserve returns seen and primed: the fit reads the
      # seen ones alone, with no car out before its run every key is 0633's, the spread switches to the new forecast's
      # orders when it can, the gate passes on cars that drained as the seen returns say and holds back on cars that
      # drained as the back-dated ones said, and the review marks older orders as history. 8 tests, about 60 seconds.
      - name: A drain is timed only from a dispatch the depot saw begin, executed (0634 against stub engines)
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          python3 -m pytest -q tests/test_agent_drain_seen_sql.py

      # 0635 learns each kind of charger's fault rate per minute of charging and its repair curve (charge_fault_v1,
      # nightly), and the check's futures draw from it behind a person's dial: a charge faults at its kind's rate and its
      # car rejoins the line owing the rest (rule 9), the charger is down for a drawn repair, and a charger down at the
      # order comes back after what is left of its repair. On a miniature depot and hand-made lines: the draws by
      # arithmetic, the fit from planted charges and fault events, the state behind the dial, every simulator output
      # key for key without the block, a drawn fault equal to 0621's down window, the car under way re-queued and never
      # counted a return, both sides meeting the same faults, the realizer and the review. 15 tests, about 135 seconds.
      - name: The futures take chargers down as the depot's chargers fail, executed (0635 against stub engines)
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          python3 -m pytest -q tests/test_agent_charger_faults_sql.py

      # 0636 has every charge clock fit measure, on its own charges once the clock knows the run, how wide each kind and
      # length of charge runs against the spread the clock gives it, and the clock scales its spread by that (the minutes
      # never move), behind a person's dial at the depot. On charges planted with a known spread within each run: each
      # length's factor by arithmetic, thin kinds and the 0.5-4 bounds, the window, the regime cut and fine ticks; the
      # clock's factor by length and 0632's clock key for key without one; the fit with the dial on and off; the audit's
      # band in and out of sample; the review's built band. 11 tests, about 170 seconds.
      - name: The charge clock's spread is what its charges show, executed (0636 against stub engines)
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          python3 -m pytest -q tests/test_agent_clock_spread_sql.py

      # 0637 has the check's state, the inbound forecast, the agent's board and the self-review read the depot's latest
      # usable return model, naming a newer fit it passed over, so a refit that finds too few returns cannot leave the
      # futures forecasting no car at work (G377). On fits planted by hand: the reader in each case, the state before and
      # after, every reader unchanged while the latest fit is usable, and the review's area in words. 6 tests, about 90
      # seconds.
      - name: The futures read the latest return model that was usable, executed (0637 against stub engines)
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          python3 -m pytest -q tests/test_agent_return_usable_sql.py

      # 0638 has the self-review keep what it found until its evidence lets it go, and read its window whole: an area
      # that leaves the window is kept as unseen with the reason (its evidence aged out, or the evidence since does not
      # name it), for one window, and a run is never cut in two (G369, G375). On planted reviews and planted evidence:
      # the carry case by case, the window by charges and by graded orders, and the nightly review written, carried
      # again, and not written. 9 tests, about 140 seconds.
      - name: The self-review remembers what it found, executed (0638 against stub engines)
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          python3 -m pytest -q tests/test_agent_review_memory_sql.py

      # 0639 has the check's futures hold a charger for the car the depot's calendar names, as the kernel's assignment
      # gate does, and say how many held chargers it could not model (G380); 0640 shows the agent the same holds on its
      # board, and 0641 the kernel's own plan car by car. On bookings planted by hand and hand lines: the holds as the
      # calendar held them at a moment, the state behind the dial, the simulator unchanged without a list and by meaning
      # with one, the realizer, the review's words, the board's new fields with nothing else moving, and each car's plan
      # as the check's simulator seats it. 19 tests, about 300 seconds.
      - name: The futures and the agent see the calendar's holds and the kernel's plan, executed (0639-0641 against stub engines)
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          python3 -m pytest -q tests/test_agent_holds_sql.py

      # 0642 has the kernel serve a car that has waited 90 minutes first, the longest wait first, and order the rest by
      # minutes of charge on the depot's charge clock (G384), mirrored in the kernel's order, the cockpits' queue, the
      # board and the check, whose futures order the line as the kernel does and whose comparison weighs the minutes cars
