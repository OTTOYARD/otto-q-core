      # charger_id NULL, so 0697's relay (an inner join on the charger) could never deliver a charge's end. Executed on
      # the live stop and emit bodies (md5-pinned): NULL on every close path before, the Started frame's charger after,
      # and the same script with and without 0723 leaves every table the same apart from those frames' charger.
      - name: A charge's closing frames name the charger that sent them, executed (0723 against the live stop step)
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          python3 -m pytest -q tests/test_stop_charge_frames_sql.py

      # 0790, G440 (G490, G491 and G492 left open): the stop door takes a running run's row before the run's proposals.
      # Executed with concurrent sessions on a stub carrying the twelve live definitions involved (md5-pinned) and
      # decide_tick's A3 verbatim: before, the live metronome and stop door deadlock; after, the door waits for the beat
      # and a proposal writer still finishes beside it; a beat that starts during a stop's dispose deadlocks with it
      # before and, after, waits and finds the run completed (but still deadlocks on a run resumed during the dispose,
      # G440's residual); the live pause during that dispose ends 'completed' before and writes 'paused' over it after
      # (G492, widened here, closed by 0791); a stop on a run that is not running keeps its old order, so the
      # prior-run purge (which deletes a run's rows by dynamic SQL and its row last) finishes beside it, except on a run
      # the purge chose paused and that is resumed before its last statement: the purge deletes it running, and since
      # 0790 a stop on it deadlocks with a lone purge (G491, pinned both ways). G490: a key check still waits for the
      # tick's FOR UPDATE; under it a constructed mid-beat resubmission deadlocks and whichever side loses the evidence
      # ledger stays right (each victim forced by deadlock_timeout); the weaker lock (throwaway database only) mislabels it.
      - name: The stop door takes the run's row before the proposals, executed (0790, concurrent sessions)
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          python3 -m pytest -q tests/test_tick_lock_sql.py

      # 0720, G435 (b): the Black Box's RPC door. ottoq_run_blackbox(uuid) and ottoq_run_blackbox_meta(uuid) closed to
      # PUBLIC, anon and authenticated, kept for service_role (the edge function's role). Executed on a stub carrying both
      # live definitions (md5-pinned), both live ACLs and the live grants and policies of its relations, then asked as each
      # role: a signed-in caller gets the whole run before and 42501 after; service_role gets the same bundle after; the
      # restore statements put both ACLs back; and the table door 0720 leaves open (G438) reads the same before and after.
      - name: The Black Box export functions are closed to the browser roles, executed (0720 against the live bodies and ACLs)
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          python3 -m pytest -q tests/test_blackbox_rpc_grants_sql.py

      # 0791, G493 and G492: the run-control doors. Seventeen run-control routines closed to PUBLIC, anon and
      # authenticated, kept for postgres and service_role, on a stub carrying all seventeen live definitions (md5-pinned)
      # and live ACLs: a signed-in caller pauses and resumes any run before and gets 42501 after; service_role still
      # pauses, resumes, starts and stops; the restore statements put every ACL and both patched definitions back. And
      # from two real sessions, a pause or resume that waited behind a stop: before 0791 it writes over the stopped run
      # (or fails, 23505 or 23503); after, it updates nothing and answers that the run is no longer running or paused.
      - name: A signed-in user cannot pause, resume, start or stop a run, and a pause or resume never writes over a stopped run, executed (0791 against the live bodies and ACLs; concurrent sessions)
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          python3 -m pytest -q tests/test_run_control_grants_sql.py

      # 0721, OTTO-Command as the one filter and executor between personal agents and OTTO-Q (Chase 2026-10-14): the
      # owner door's live bodies (md5-pinned) before and after 0721 -- a signed-in agent may change a production run, a
      # passcode or a key may not, a lower limit there applies only as the one confirm of a preview the same principal
      # recorded within 15 minutes, every command records its person, its door and the preview it confirmed -- and the
      # gateway's ask_ottocommand over HTTP against the same SQL with 0721 applied. OTTO-Q enforces preview-then-confirm
      # by the same principal; it cannot see a person's yes, which the person's own agent relays. And (the afternoon of
      # 2026-10-14) a signed-in owner's charge limit and every-return orders saved to the cars and carried onto each new
      # demo and production run, the owner-settings guard, the passcode refused while production is live, the model
      # ledger door (over tests/fixtures/model_call_ledger_stub.sql, the live ledger's bodies), and in node the model
      # request, verbatim replay, pause_turn, refusal and fallback, the web-injection rule and ottocommand_search, all
      # against a fake fetch: no call reaches the Anthropic API from CI.
      - name: OTTO-Command is the door; production changes carry a signed-in principal, a lowering is the one confirm of its own preview, saved settings carry across runs, and an ask that read the web changes nothing (0721 against the live bodies; HTTP end to end)
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          python3 -m pytest -q tests/test_ottocommand_executor_sql.py
          node --test --test-concurrency=1 tests/ottocommand_executor.test.mjs

      # 0701, G428: the signing key, the three signers, the purge and the audit writers closed to the browser roles,
      # executed on a stub carrying the live resolver and signers and asked as each role what it can do; service_role
      # and a SECURITY DEFINER engine caller still sign byte for byte. It had no executed step and skipped in the pytest
      # step like the thirteen above.
      - name: The signing key and the engine's destructive doors are closed to the browser roles, executed (0701 against the live bodies)
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          python3 -m pytest -q tests/test_signing_grants_sql.py

      # 0722, G428's rotation half: system:v2, a new Vault secret no browser role can read (service_role and postgres
      # can, as for v1), signs every new event, SDR and audit bundle, and system:v1 stays active so every row it signed
      # still verifies. Executed after 0701 on a stub carrying the five signing writers, both verifiers and the payload
      # hash with their live bodies, and a Vault stand-in that reports every read of a secret: it refuses before 0701 and
      # without Chase's go-ahead, signs new rows with v2, verifies old v1 rows, and never selects a secret.
      - name: The signing key is rotated and every old signature still verifies, executed (0722 after 0701 against the live bodies)
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          python3 -m pytest -q tests/test_signing_rotation_sql.py

      # G12, first rung: the only step in this file that talks to a database.
      # Read-only, and it SOFT-SKIPS without the secret so secretless PRs still pass.
      #
      # It gates the one direction of scripts/check-drift.sql that is currently at zero
      # and that a mistake would move: every migration file carrying a real version
      # header has a ledger row. It deliberately does NOT gate on the drift check
      # returning CLEAN -- db/checks/0206 measured a floor of 67 applied-with-no-file
      # (the pre-G18 era) plus 41 name mismatches that no future discipline can clear,
      # and a permanently-red gate is a gate nobody reads, which is what 0206 is about.
      - name: Database reachability + migration ledger gate (read-only)
        env:
          OTTOQ_DATABASE_URL: ${{ secrets.OTTOQ_DATABASE_URL }}
        run: |
          if [ -n "${OTTOQ_DATABASE_URL}" ]; then pip install "psycopg[binary]"; fi
          python3 scripts/ci_db_check.py

      # G110, second half. scripts/check-edge-drift.sh is the ONLY thing that can prove
      # edge-functions/ matches what is deployed, and until now it ran NOWHERE -- not here, not
      # in any session -- for want of SUPABASE_ACCESS_TOKEN. That is why orchestrator v29 lived
      # only in production for four hours with no signal able to say so (db/checks/0306 §3).
      #
      # WHY THIS ONLY FAILS ON main, AND THIS IS THE WHOLE DESIGN. The script compares the REPO
      # against the DEPLOYED function. On a pull request the repo copy is the PROPOSED state, so
      # it legitimately differs from deployed until the change is deployed -- every PR that edits
      # an edge function would go red for being a PR that edits an edge function. That is the
      # permanently-red gate this file warns about twice already, so on a PR the result is a
      # WARNING and on push-to-main it is a FAILURE. main is where repo and deployed are supposed
      # to agree, and a disagreement there is real drift.
      #
      # 🔴 DECIDED 2026-09-21: THE SECRET IS NOT COMING, SO THIS STEP IS PERMANENTLY A SKIP.
      # Chase declined to add SUPABASE_ACCESS_TOKEN as a repository secret. That is a
      # legitimate call -- a Supabase PAT carries full account privileges, and handing one to CI
      # to win a comparison is a poor trade. The consequence must be stated rather than left
      # looking pending: **this step will print its notice and exit 0 on every run, forever, and
      # a green `verify` NEVER means edge-functions/ matches what is deployed.** Nothing in CI
      # can check that -- the Management API needs auth and there is no unauthenticated route to
      # a deployed function's source, so this is a ceiling, not a TODO.
      # THE SUBSTITUTE, and its exact weakness. Drift is checked in-session through the Supabase
      # MCP connector, which reads deployed source with no repo secret (db/checks/0306 §8). That
      # is strictly weaker in one way worth naming: it happens when a person remembers, not on
      # every push -- and orchestrator v29 living only in production for four hours is precisely
      # what "when a person remembers" failed to catch. Treat edge-function deploys as the one
      # place this repo has no automated guard.
      #
      # SOFT-SKIPS WITHOUT THE SECRET, exactly like the ledger gate above, so secretless PRs and
      # forks still pass. The script's own exit codes are respected rather than reinterpreted:
      #   0 = compared, no unexpected drift
      #   1 = unexpected drift (it prints which files)
      #   2 = COULD NOT COMPARE (no CLI, no token, download failed) -- the script refuses to
      #       report a pass in that case, and neither does this step: it surfaces a warning and
      #       never a green tick that means nothing.
      # ottoq-energy-mpc is an acknowledged exception INSIDE the script (G69: the deployed copy
      # still carries hardcoded credential fallbacks, and syncing it into the repo would
      # re-commit a live secret), so it does not need handling here.
      - name: Edge-function drift, repo vs deployed (read-only; warns on PRs, fails on main)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -uo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::notice::no SUPABASE_ACCESS_TOKEN -- edge drift NOT checked. This is a skip, not a pass, and it is PERMANENT: the secret was declined 2026-09-21 by decision, not oversight. Verify drift in-session via the Supabase MCP connector (db/checks/0306 §8). A green verify does not mean edge-functions/ matches deployed."
            exit 0
          fi
          npm i -g supabase >/dev/null 2>&1 || true
          scripts/check-edge-drift.sh; rc=$?
          case "$rc" in
            0) echo "edge-functions/ matches deployed (no unexpected drift)" ;;
            1) if [ "${GITHUB_REF:-}" = "refs/heads/main" ]; then
                 echo "::error::edge-function drift on main: the repo and the deployment disagree. See the DRIFT lines above."
                 exit 1
               else
                 echo "::warning::edge-function drift -- expected on a PR that changes an edge function; verify it is deployed before/with merge."
                 exit 0
               fi ;;
            2) echo "::warning::edge drift could not be compared (exit 2). NOT a pass -- see the script's output above."
               exit 0 ;;
            *) echo "::error::check-edge-drift.sh exited $rc, which it does not document"; exit 1 ;;
          esac
