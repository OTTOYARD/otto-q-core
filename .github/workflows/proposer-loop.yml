name: proposer-loop
# THE PROPOSER IN THE LOOP (founder decision, 2026-09-13: "it should be in the
# loop always"). This job runs bridge/proposer_bridge.py against the LIVE engine:
# read the decision frame, solve it with CP-SAT, and submit every row through
# public.ottoq_submit_external_proposal -- the same door cuOpt uses. It never
# writes a booking, never INSERTs a proposal, never touches a vehicle. The
# deterministic kernel still disposes of every row it submits.
#
# WHY MANUAL BY DEFAULT. A cron that fires at an idle depot finds nothing to
# propose into, and a red job every ten minutes teaches everyone to ignore red
# jobs. `--idle-ok` makes idleness exit 0, so a schedule is safe to switch on --
# see the commented block below -- but the default here is deliberate: start a
# twin run first, then dispatch this.
#
# WHY IT CANNOT CONTAMINATE A CERTIFICATION. The bridge refuses, before every
# fire, if pg_stat_activity shows ottoq_determinism_pair or ottoq_ab_pair in
# flight, and refuses outright if the depot's running run is a cert_harness arm.
# A pair runs both arms in ONE transaction, so its rows are invisible to this
# session until it commits -- which is why the guard asks the process list, the
# only authority the house rules recognise for "in flight".
#
# SECRETS IT NEEDS (repository secrets, Settings -> Secrets and variables -> Actions):
#   OTTOQ_DATABASE_URL  Supabase Postgres URI for otto-q-core (gxdrcyphqjzjsuhxuqtg).
#   ANTHROPIC_API_KEY   only for the advisory fire; the CP-SAT loop does not use it.
# Neither is ever echoed: the DSN is passed as an env var, and the advisor reads
# its key from the environment (bridge/llm_proposer.py holds no key material).

on:
  workflow_dispatch:
    inputs:
      depot:
        description: depot_id (default Nashville flagship)
        required: false
        default: "11111111-1111-1111-1111-111111111111"
      run:
        description: "sim_run_id, or 'auto' to resolve the depot's one running run"
        required: false
        default: "auto"
      fires:
        description: how many fires before stopping
        required: false
        default: "12"
      interval_s:
        description: seconds between fires
        required: false
        default: "20"
      states:
        description: vehicle states to propose for (narrowing only)
        required: false
        default: "arrived_at_gate"
      advisor:
        description: "also run the LLM advisor fire (costs money; needs ANTHROPIC_API_KEY)"
        required: false
        default: "false"
  # Switch this on once a long-running twin run is the norm rather than the
  # exception. --idle-ok means an idle depot is a green no-op, and the
  # certification guard means a round in flight is a logged skip.
  # schedule:
  #   - cron: "*/10 * * * *"

concurrency:
  # One loop per depot at a time. Two loops would both read the same frame and
  # submit rows the selector then has to order, which proves nothing.
  group: proposer-loop-${{ github.event.inputs.depot || 'flagship' }}
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # requirements.txt carries the OR-Tools pin; the solver's version is part of
      # a run's identity, so the loop must install THE pin, not the latest.
      - run: pip install -r requirements.txt "psycopg[binary]"
      - name: Refuse to start without the connection secret
        run: |
          if [ -z "${OTTOQ_DATABASE_URL}" ]; then
            echo "::error::OTTOQ_DATABASE_URL is not set. Add it as a repository secret;"
            echo "::error::the loop reads the live engine and there is no offline fallback here."
            exit 1
          fi
        env:
          OTTOQ_DATABASE_URL: ${{ secrets.OTTOQ_DATABASE_URL }}
      # WHY --via batch, added 2026-09-14 (db/checks/0218). The default is
      # --via door: one ottoq_submit_external_proposal call per row. That route
      # writes NO ottoq_proposer_fire_log record -- bridge/proposer_bridge.py
      # says so in as many words ("NOT ledgered on the door route; use
      # via='batch' (0260) for that") -- so the four live runs of 2026-09-14
      # produced 239 proposals and all 6 enactments while leaving zero fire
      # rows, and the fire log looked like CP-SAT had fired four times in its
      # life when it had fired across six runs.
      #
      # The batch route also submits the plan as ONE sub-transaction: a refusal
      # on row k rolls back rows 1..k-1, because a half-submitted plan is not a
      # plan. The door route gives that up silently, one row at a time.
      # THE LOOP NOW ARMS THE RUN IT PROPOSES INTO, and refuses a blind frame.
      # Added 2026-09-14 (db/checks/0214). 0278 built ottoq_agentic_arm -- one
      # call, all-or-nothing, receipt-checked -- and nothing ever called it. Of
      # the seven runs that have ever carried a proposer_frame_facts row exactly
      # ONE did, and it was a probe created to measure the blindness. So all six
      # `proposer_live` runs, and all 329 CP-SAT proposals they produced, were
      # solved against a frame with the selector facts off, where a stall the
      # door had already reserved reads as free. At tick 4 on this depot the
      # blind frame offered the solver 25 charge points and the facts frame
      # offered 0 -- 24 reserved, 1 charger faulted.
      #
      # No flag appears below because arming is the DEFAULT now; --no-arm and
      # --allow-blind-frame exist for measurement and both are explicit. Arming
      # also refuses a certification arm outright (ERRCODE 42501), which closes
      # that hole on the explicit --run path as well as the resolved one.
      - name: CP-SAT proposer loop (one batch per fire; ledgered; the kernel disposes)
        env:
          OTTOQ_DATABASE_URL: ${{ secrets.OTTOQ_DATABASE_URL }}
        run: |
          python3 -m bridge.proposer_bridge \
            --dsn "$OTTOQ_DATABASE_URL" \
            --run "${{ github.event.inputs.run || 'auto' }}" \
            --depot "${{ github.event.inputs.depot || '11111111-1111-1111-1111-111111111111' }}" \
            --site bridge/sites/nashville-flagship.json \
            --states "${{ github.event.inputs.states || 'arrived_at_gate' }}" \
            --default-ready-delta 30 \
            --allow-rejection \
            --loop \
            --interval-s "${{ github.event.inputs.interval_s || '20' }}" \
            --max-fires "${{ github.event.inputs.fires || '12' }}" \
            --idle-ok \
            --via batch \
            --json-out receipts.json
      # The advisor's SDK is installed HERE, not in the job-wide install, because
      # the CP-SAT loop never imports it (bridge/llm_proposer.py imports its
      # client lazily for exactly that reason) and a package the main path does
      # not use should not be able to break the main path.
      #
      # THIS STEP EXISTS BECAUSE ITS ABSENCE WAS THE WHOLE FAULT. 2026-09-14
      # 00:58 UTC, run 34794270284: ANTHROPIC_API_KEY was present and correct,
      # the depot was live, the CP-SAT loop had just submitted 72 proposals --
      # and the advisory step died on "the anthropic SDK is not installed".
      # The advisory proposer had never run once in its life, and the reason
      # was one uninstalled package, not the key, the gate, or the code.
      # Pinned, because an advisor's model client is part of a fire's identity
      # the same way ortools is part of a plan's.
      #
      # WHY 1.5.0 AND NOT SOMETHING OLDER. The first pin here was 0.69.0, chosen
      # without checking, and the next fire died on
      #   TypeError: Messages.create() got an unexpected keyword argument 'output_config'
      # bridge/llm_proposer.py asks for structured output via
      #   output_config={"effort": ..., "format": {"type": "json_schema", ...}}
      # and that parameter does not exist in 0.69.0. Measured against the
      # published wheels rather than guessed again: anthropic/resources/messages/
      # messages.py contains no occurrence of output_config in 0.76.0 and 75 in
      # 0.77.0, so 0.77.0 is the floor. 1.5.0 (the current release, checked
      # 2026-09-14) carries OutputConfigParam with exactly the two keys the code
      # sends -- effort, one of low|medium|high|xhigh|max, and
      # format.JSONOutputFormatParam {type: "json_schema", schema} -- so the
      # call site was right all along and only the pin was wrong.
      - name: Install the advisor's SDK (advisor fires only)
        if: ${{ github.event.inputs.advisor == 'true' }}
        run: pip install "anthropic==1.5.0"
      - name: Advisory fire (optional, priced and capped per run)
        if: ${{ github.event.inputs.advisor == 'true' }}
        env:
          OTTOQ_DATABASE_URL: ${{ secrets.OTTOQ_DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "${ANTHROPIC_API_KEY}" ]; then
            echo "::error::advisor requested but ANTHROPIC_API_KEY is not set"
            exit 1
          fi
          # --idle-ok for the same reason the loop step has it: if the depot went
          # idle between the two steps, that is not a failure of the advisor.
          python3 -m bridge.llm_proposer \
            --dsn "$OTTOQ_DATABASE_URL" \
            --run "${{ github.event.inputs.run || 'auto' }}" \
            --depot "${{ github.event.inputs.depot || '11111111-1111-1111-1111-111111111111' }}" \
            --cap-usd 0.25 \
            --idle-ok \
            --json-out advisor.json
      - name: Keep the receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proposer-receipts
          path: |
            receipts.json
            advisor.json
          if-no-files-found: ignore
